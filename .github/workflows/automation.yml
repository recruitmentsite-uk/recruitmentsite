name: Recruitment Site Automation

# Cloud departments — run on GitHub even when local machines are off.
on:
  schedule:
    # Note: GitHub coalesces same-minute crons into one run with one schedule string.
    # Keep department crons OFF the hour so they are not skipped by hourly matching.
    - cron: "15 5 * * *"  # Expand prospect list + partner feeds + CS + daily report (05:15 UTC)
    - cron: "0 6 * * *"   # Job sync (06:00 UTC) — ok: matching also fires; sync job checks its own cron
    - cron: "30 6 * * *"  # IndexNow / SEO URL ping after sync (06:30 UTC)
    - cron: "15 7 * * *"  # Enrichment + expire (07:15 UTC)
    - cron: "15 9 * * *"  # Alert digests (09:15 UTC)
    - cron: "15 10 * * 1-5" # Employer sales outreach weekdays (10:15 UTC)
    - cron: "0 * * * *"   # Matching hourly
    - cron: "15 8 * * 1"  # Weekly metrics Monday 08:15 UTC
    - cron: "20 8 * * *"  # Social CMS — publish due scheduled posts (08:20 UTC)
  workflow_dispatch:
    inputs:
      department:
        description: "Run one department or all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - expand-and-ops
          - sync-jobs
          - index-seo
          - enrich-and-expire
          - alert-digests
          - employer-outreach
          - match-candidates
          - weekly-metrics
          - site-smoke
          - social-publish
          - warm-leads

env:
  NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk

jobs:
  expand-and-ops:
    if: >
      github.event.schedule == '15 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'expand-and-ops'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - name: Restore employer prospect growth cache
        uses: actions/cache@v4
        with:
          path: |
            data/employer-prospects.json
            data/scrape-progress.json
            data/cqc-care-directory.csv
            data/competitor-search-progress.json
            data/competitor-employers.json
          key: employer-prospects-${{ github.run_id }}
          restore-keys: |
            employer-prospects-
      - name: "Sales — expand employer prospect list (CQC + enrich)"
        run: pnpm prospects:expand
        continue-on-error: true
      - name: "Sales — UK multi-sector board scrape + ingest new employers"
        # Rotate ~60 Reed/Adzuna searches/day across UK sectors & nations; ingest unmatched
        run: timeout 25m pnpm prospects:competitors || true
        continue-on-error: true
        env:
          COMPETITOR_LIMIT: "60"
          COMPETITOR_MAX_PAGES: "3"
          COMPETITOR_DELAY_MS: "1000"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: "Sales — scrape emails from employer websites (grow sendable list)"
        run: SCRAPE_LIMIT=250 SCRAPE_CONCURRENCY=10 pnpm prospects:scrape || true
        continue-on-error: true
      - name: "Marketing — partner feed health (dry, no BD spam)"
        run: pnpm ops:partner-feeds
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PARTNER_FEEDS_DRY: "1"
      - name: "Site + Sales + Marketing + CS — daily report & inbox triage"
        run: pnpm ops:daily-report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HELLO_IMAP_PASS: ${{ secrets.HELLO_IMAP_PASS }}
          ADMIN_IMAP_PASS: ${{ secrets.ADMIN_IMAP_PASS }}
          BILLING_IMAP_PASS: ${{ secrets.BILLING_IMAP_PASS }}
          PRIVACY_IMAP_PASS: ${{ secrets.PRIVACY_IMAP_PASS }}
          LEGAL_IMAP_PASS: ${{ secrets.LEGAL_IMAP_PASS }}
          NOTIFICATIONS_IMAP_PASS: ${{ secrets.NOTIFICATIONS_IMAP_PASS }}
          GHMAIL_IMAP_PASS: ${{ secrets.GHMAIL_IMAP_PASS }}
          JOBS_IMAP_PASS: ${{ secrets.JOBS_IMAP_PASS }}
      - name: "Sales — warm opens/clicks → tickets + £99 offers"
        run: pnpm ops:warm-leads
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          WARM_LEAD_OFFER_LIMIT: "20"
          WARM_LEAD_SEND_EMAIL: "1"

  warm-leads:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'warm-leads')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - name: "Sales — sync warm leads to tickets and send £99 offers"
        run: pnpm ops:warm-leads
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          WARM_LEAD_OFFER_LIMIT: "20"
          WARM_LEAD_SEND_EMAIL: "1"

  sync-jobs:
    if: >
      github.event.schedule == '0 6 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'sync-jobs'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm jobs:sync
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_SYNC_PAGES: "2"
          ATS_MAX_PER_BOARD: "40"
          REED_SYNC_PAGES: "3"
          REED_SYNC_PER_PAGE: "100"

  index-seo:
    if: >
      github.event.schedule == '30 6 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'index-seo'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - name: "Marketing — IndexNow (Bing/Yandex)"
        run: pnpm ops:indexnow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          INDEXNOW_LIMIT: "3000"
      - name: "Marketing — Google Indexing API"
        run: pnpm ops:gsc -- --api
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          GOOGLE_INDEXING_LIMIT: "100"

  enrich-and-expire:
    if: >
      github.event.schedule == '15 7 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'enrich-and-expire'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - run: pnpm jobs:enrich
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: pnpm jobs:expire
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  alert-digests:
    if: >
      github.event.schedule == '15 9 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'alert-digests'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - run: pnpm alerts:digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk

  employer-outreach:
    if: >
      github.event.schedule == '15 10 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'employer-outreach'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - name: Restore employer prospect growth cache
        uses: actions/cache@v4
        with:
          path: |
            data/employer-prospects.json
            data/scrape-progress.json
            data/cqc-care-directory.csv
            data/competitor-search-progress.json
            data/competitor-employers.json
          key: employer-prospects-${{ github.run_id }}
          restore-keys: |
            employer-prospects-
      - name: "Sales — refresh prospects then send HTML outreach batch"
        run: |
          pnpm prospects:expand || true
          # Extra scrape pass before send (main growth scrape runs at 05:00 expand)
          SCRAPE_LIMIT=100 SCRAPE_CONCURRENCY=10 pnpm prospects:scrape || true
          pnpm campaign:employers
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTREACH_LIMIT: "50"
          # CI starts without scraped cache; guessed emails from public domains until scrape fills
          OUTREACH_INCLUDE_GUESSED: "1"
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
      - name: "Sales — ticket every open/click + offer first 20 warm leads £99"
        run: pnpm ops:warm-leads
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          WARM_LEAD_OFFER_LIMIT: "20"
          WARM_LEAD_SEND_EMAIL: "1"

  match-candidates:
    if: >
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'match-candidates'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - run: pnpm match:run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  site-smoke:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'site-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: "Site — live HTTP smoke"
        run: pnpm ops:site-smoke
        env:
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk

  weekly-metrics:
    if: >
      github.event.schedule == '15 8 * * 1' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'weekly-metrics'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @placeuk/shared build
      - run: pnpm metrics:weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Email Monday ≤1hr ops brief to hello@
        run: pnpm ops:weekly-brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk

  social-publish:
    if: >
      github.event.schedule == '20 8 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.department == 'all' || github.event.inputs.department == 'social-publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: "Marketing — publish due Social CMS posts"
        run: pnpm social:publish-due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
        continue-on-error: true
