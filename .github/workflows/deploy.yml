name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@56.5.0

      - name: Deploy to production
        # Build on Vercel so production env vars are available (local vercel pull masks them).
        # --no-wait avoids hanging when status stays UNKNOWN.
        run: vercel deploy --prod --yes --force --no-wait --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
