name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@56.5.0

      # Hobby teams block CLI deploys when git commit author ≠ Vercel member.
      # Strip .git so vercel deploy does not attach githubCommitAuthor* metadata.
      - name: Strip git metadata (Hobby author block)
        run: rm -rf .git

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inject real env for Vercel build
        # vercel pull masks Sensitive values as [SENSITIVE], which breaks Next.js builds.
        run: |
          ENV_FILE=".vercel/.env.production.local"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(".vercel/.env.production.local")
          lines = path.read_text().splitlines() if path.exists() else []
          keys = [
              "NEXT_PUBLIC_SUPABASE_URL",
              "NEXT_PUBLIC_SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
          ]
          values = {k: os.environ[k] for k in keys}
          kept = []
          for line in lines:
              if not line or line.lstrip().startswith("#") or "=" not in line:
                  kept.append(line)
                  continue
              k = line.split("=", 1)[0]
              if k in values:
                  continue
              kept.append(line)
          for k, v in values.items():
              kept.append(f"{k}={v}")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("\n".join(kept) + "\n")
          print("Injected", ", ".join(keys))
          PY
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy prebuilt to production
        run: |
          set -uo pipefail
          set +e
          OUT=$(vercel deploy --prebuilt --prod --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          URL=$(echo "$OUT" | grep -Eo 'https://web-[a-z0-9]+-backend-7626s-projects\.vercel\.app' | head -n1 || true)
          if [ -z "$URL" ]; then
            echo "No production deployment URL found (vercel exit $CODE)"
            exit 1
          fi
          echo "Waiting for $URL to become READY"
          READY=0
          for i in $(seq 1 40); do
            STATE=$(vercel inspect "$URL" --json --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("readyState",""))' 2>/dev/null || true)
            INFO=$(vercel inspect "$URL" --token=${{ secrets.VERCEL_TOKEN }} 2>&1 || true)
            echo "poll $i: readyState=${STATE:-?} $(echo "$INFO" | tr '\n' ' ' | cut -c1-180)"
            if [ "$STATE" = "READY" ] || echo "$INFO" | grep -Eqi '(^|[[:space:]])Ready([[:space:]]|$)'; then
              READY=1
              break
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ] \
              || echo "$INFO" | grep -Eqi '(^|[[:space:]])(Error|Canceled|Blocked)([[:space:]]|$)'; then
              echo "Deployment failed (state=${STATE:-unknown})"
              exit 1
            fi
            sleep 15
          done
          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for READY"
            exit 1
          fi
          echo "Aliasing $URL"
          vercel alias set "$URL" recruitmentsite.co.uk --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set "$URL" www.recruitmentsite.co.uk --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "Site — post-deploy smoke"
        run: |
          sleep 20
          pnpm ops:site-smoke
        env:
          NEXT_PUBLIC_SITE_URL: https://recruitmentsite.co.uk
